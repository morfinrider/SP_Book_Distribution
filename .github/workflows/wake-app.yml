name: Daily SJP Books App Wake-up

on:
  schedule:
    # 7:00 AM IST = 01:30 UTC
    - cron: "30 1 * * *"

  workflow_dispatch:

permissions:
  contents: read

jobs:
  wake-app:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Playwright
        run: |
          pip install playwright
          playwright install chromium --with-deps

      - name: Wake SJP Books app
        run: python scripts/wake_app.py
